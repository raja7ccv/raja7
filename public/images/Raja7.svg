<svg width="800" height="300" viewBox="0 0 800 300" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <!-- Metallic Gold Gradient -->
    <linearGradient id="goldGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFE259" />
      <stop offset="50%" stop-color="#FFA751" />
      <stop offset="100%" stop-color="#E65C00" />
    </linearGradient>
    
    <!-- Premium Drop Shadow -->
    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="6" stdDeviation="10" flood-color="#FFA751" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Dark Background Plate -->
  <rect width="100%" height="100%" rx="20" fill="#0B0E14" />

  <!-- Logo Mark -->
  <g filter="url(#goldGlow)">
    <!-- Crown -->
    <path d="M 60 115 L 100 45 L 140 95 L 180 45 L 220 115 Z" fill="url(#goldGradient)" />
    <!-- 7 / Shield Crest -->
    <path d="M 50 130 Q 140 130 230 130 L 210 190 L 140 265 L 95 205 L 140 180 L 165 150 L 90 150 C 75 150 65 170 65 170 Z" fill="url(#goldGradient)" />
  </g>

  <!-- Typography -->
  <text x="270" y="200" font-family="'Inter', 'Montserrat', sans-serif" font-weight="900" font-size="115" letter-spacing="8" fill="url(#goldGradient)">
    RAJA<tspan fill="#FFFFFF">7</tspan>
  </text>
</svg>
